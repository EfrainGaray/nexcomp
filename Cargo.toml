[package]
name = "nexcomp"
version = "1.8.0"
edition = "2021"
rust-version = "1.85"
description = "NEXCOMP — Next-generation lossless compressor"
license = "MIT"

[dependencies]
thiserror = "1.0"
chacha20poly1305 = "0.10"
# Direct only to turn on its zeroize feature, which chacha20poly1305 leaves off:
# without it the one-time Poly1305 key and the MAC state are freed unwiped.
poly1305 = { version = "0.8", features = ["zeroize"] }
clap = { version = "4.4", features = ["derive"] }
rand = "0.9"
rayon = "1.10"
argon2 = { version = "0.5", features = ["zeroize"] }
rpassword = "7"
zeroize = "1"
blake3 = "1"

[dev-dependencies]
blake3 = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "rans_bench"
harness = false

[[bench]]
name = "repair_bench"
harness = false

[[bench]]
name = "ajedrez_gain"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# target-cpu = "native" # set via RUSTFLAGS="-C target-cpu=native"
